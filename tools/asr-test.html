<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Web Speech ASR 自检</title>
<style>body{font:14px/1.6 system-ui;margin:24px;background:#111;color:#eee}pre{white-space:pre-wrap;background:#1b1e26;padding:12px;border-radius:8px}</style>
</head>
<body>
<h3>Web Speech API 自检</h3>
<p>页面加载后自动启动中文识别，只记录引擎事件，不回放任何声音。</p>
<pre id="log">starting…</pre>
<script>
const log = (s) => {
  const el = document.getElementById('log');
  el.textContent += '\n' + new Date().toISOString().slice(11, 19) + ' ' + s;
  fetch('/log', { method: 'POST', body: s }).catch(() => {});
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { log('NO_API 当前浏览器没有 Web Speech API'); }
else {
  log('API_OK 构造识别器');
  const r = new SR();
  r.lang = 'zh-CN'; r.continuous = true; r.interimResults = true;
  r.onstart = () => log('ONSTART 识别引擎已启动（麦克风已开）');
  r.onaudiostart = () => log('AUDIOSTART 收到音频流');
  r.onspeechstart = () => log('SPEECHSTART 检测到人声');
  r.onresult = (e) => { for (const res of e.results) log((res.isFinal ? 'FINAL ' : 'INTERIM ') + res[0].transcript); };
  r.onerror = (e) => log('ERROR ' + e.error + (e.message ? ' ' + e.message : ''));
  r.onend = () => { log('ONEND 引擎结束'); setTimeout(() => { try { r.start(); log('RESTART') } catch (err) { log('RESTART_FAIL ' + err.message) } }, 300); };
  try { r.start(); } catch (e) { log('START_FAIL ' + e.message); }
}
</script>
</body>
</html>
